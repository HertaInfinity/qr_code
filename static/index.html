<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6478;
    --line: #d5dbe7;
    --accent: #2b50ff;
    --accent-ink: #ffffff;
    --error: #b3261e;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--font);
    font-size: 1rem; line-height: 1.5;
  }
  main { max-width: 64rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05; margin: 0 0 .5rem; font-weight: 800; letter-spacing: -0.02em; }
  h2 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  .lede { color: var(--muted); margin: 0 0 2rem; max-width: 52ch; }

  .workspace { display: grid; gap: 1.5rem; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 760px) { .workspace { grid-template-columns: 1fr 22rem; } }

  form { display: flex; flex-direction: column; gap: .75rem; }
  label { font-weight: 700; }
  textarea {
    width: 100%; min-height: 9rem; resize: vertical; padding: .85rem 1rem;
    font: inherit; color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-radius: 8px;
  }
  textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  textarea:focus-visible { border-color: var(--accent); outline-offset: 0; }
  .meta { display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: .9rem; }

  button {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 8px;
    padding: .75rem 1.25rem; border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .6; cursor: progress; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; }

  #status { min-height: 1.5rem; margin: 0; color: var(--muted); }
  #status.error { color: var(--error); font-weight: 500; }

  .frame {
    background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 1.25rem;
  }
  .preview { aspect-ratio: 1; display: grid; place-items: center; }
  .preview img, .preview svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .result { margin-top: 1rem; display: none; }
  .result.show { display: block; }
  .result p { margin: 0 0 .75rem; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }

  .gallery-head { display: flex; align-items: baseline; justify-content: space-between; margin: 3rem 0 1rem; }
  #count { color: var(--muted); }
  #gallery { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(21rem, 100%), 1fr)); }
  #gallery li { display: flex; gap: 1rem; align-items: flex-start; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .75rem; }
  #gallery .info { flex: 1; min-width: 0; }
  #gallery .text { margin: 0 0 .5rem; max-height: 7.5rem; overflow-y: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
  #gallery time { font-size: .8rem; color: var(--muted); }
  #gallery a { flex: none; width: 7.5rem; border: 2px solid var(--line); border-radius: 6px; padding: .25rem; }
  #gallery a:hover { border-color: var(--ink); }
  #gallery img { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; }
  #empty { color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    button { transition: transform .08s ease; }
    button:active:not(:disabled) { transform: translateY(1px); }
  }
</style>
</head>
<body>
<main>
  <h1>QR code generator</h1>
  <p class="lede">Paste a link or any text and get a QR code you can download or share.</p>

  <div class="workspace">
    <form id="form" novalidate>
      <label for="text">Text or link to encode</label>
      <textarea id="text" maxlength="2000" placeholder="https://example.com" aria-describedby="status"></textarea>
      <div class="meta"><span>Up to 2000 characters</span><span id="chars">0 / 2000</span></div>
      <div class="actions">
        <button class="primary" id="go" type="submit">Generate QR code</button>
        <button type="button" id="clear">Clear</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <section aria-label="Preview">
      <div class="frame">
        <div class="preview" id="preview">
          <svg viewBox="0 0 21 21" role="img" aria-label="Empty QR code placeholder">
            <g fill="none" stroke="#14213d" stroke-width="1">
              <rect x="0.5" y="0.5" width="6" height="6"/><rect x="14.5" y="0.5" width="6" height="6"/><rect x="0.5" y="14.5" width="6" height="6"/>
            </g>
            <g fill="#14213d">
              <rect x="2" y="2" width="3" height="3"/><rect x="16" y="2" width="3" height="3"/><rect x="2" y="16" width="3" height="3"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="result" id="result">
        <p id="filename"></p>
        <div class="actions">
          <button type="button" id="download">Download PNG</button>
          <button type="button" id="copy">Copy link</button>
        </div>
      </div>
    </section>
  </div>

  <div class="gallery-head">
    <h2>Recent QR codes</h2>
    <span id="count"></span>
  </div>
  <p id="empty" hidden>No QR codes yet. Generate one above.</p>
  <ul id="gallery"></ul>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const form = $('#form'), input = $('#text'), goBtn = $('#go'), statusEl = $('#status');
  let current = null; // { url, filename }

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
  }

  // Wraps fetch: shows a wake-up message if the free-tier server is slow to respond.
  async function api(path, options) {
    const slow = setTimeout(
      () => setStatus('Waking up the server. The first request can take up to a minute.'), 4000);
    try {
      const res = await fetch(path, options);
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON response */ }
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
      return data;
    } finally {
      clearTimeout(slow);
    }
  }

  input.addEventListener('input', () => { $('#chars').textContent = input.value.length + ' / 2000'; });

  $('#clear').addEventListener('click', () => {
    input.value = ''; $('#chars').textContent = '0 / 2000'; setStatus(''); input.focus();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) { setStatus('Enter some text or a link first.', true); input.focus(); return; }

    goBtn.disabled = true;
    setStatus('Generating…');
    try {
      const data = await api('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      showResult(data.qr_code_url, data.filename);
      setStatus('QR code ready.');
      loadGallery();
    } catch (err) {
      setStatus(err.message + '. Check your connection and try again.', true);
    } finally {
      goBtn.disabled = false;
    }
  });

  function showResult(url, filename) {
    current = { url, filename };
    const img = new Image();
    img.alt = 'Generated QR code';
    img.src = url;
    $('#preview').replaceChildren(img);
    $('#filename').textContent = filename;
    $('#result').classList.add('show');
    $('#copy').textContent = 'Copy link';
  }

  $('#download').addEventListener('click', async () => {
    if (!current) return;
    try {
      const blob = await (await fetch(current.url)).blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = current.filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (err) {
      window.open(current.url, '_blank', 'noopener'); // fallback: open image in a new tab
    }
  });

  $('#copy').addEventListener('click', async () => {
    if (!current) return;
    try {
      await navigator.clipboard.writeText(current.url);
      $('#copy').textContent = 'Link copied';
    } catch (err) {
      setStatus('Could not copy the link. Copy it from the address bar after opening the image.', true);
    }
  });

  async function loadGallery() {
    for (const item of items) {
      const li = document.createElement('li');

      const info = document.createElement('div');
      info.className = 'info';
      const text = document.createElement('p');
      text.className = 'text';
      text.textContent = item.text || '(text not recorded)';
      const time = document.createElement('time');
      const when = item.created ? new Date(item.created) : null;
      time.textContent = when && !isNaN(when)
        ? when.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
      info.append(text, time);

      const a = document.createElement('a');
      a.href = item.url; a.target = '_blank'; a.rel = 'noopener';
      const img = new Image();
      img.loading = 'lazy'; img.src = item.url;
      img.alt = 'QR code for: ' + (item.text || '').slice(0, 80);
      a.append(img);

      li.append(info, a);
      list.append(li);
    }
  }

  loadGallery();
</script>
</body>
</html>
